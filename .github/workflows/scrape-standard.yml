name: Scrape codes (standard mode)

# FR-3 Standard Mode: poll every 15 minutes.
# GitHub Actions cron is best-effort, not guaranteed-to-the-minute - treat
# 15 minutes as a target cadence, not an SLA.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run ingestion pipeline
        run: python scraper.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}